<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Sleep Airline - 我的旅程</title>
    <link rel="stylesheet" href="styles.css?v=2">
    <link rel="manifest" href="manifest.json">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
</head>
<body>
    <!-- 載入動畫 -->
    <div id="loading" class="loading">
        <div class="loading-spinner"></div>
        <p>載入中...</p>
    </div>

    <!-- 旅程列表頁 -->
    <div id="journeys-page" class="page active">
        <header class="page-header">
            <h1>✈️ 我的航程記錄</h1>
            <p class="subtitle">探索你的睡眠旅程</p>
        </header>
        <div id="journeys-list" class="journeys-container">
            <!-- 動態載入的旅程卡片 -->
        </div>
        <div id="empty-state" class="empty-state" style="display: none;">
            <div class="empty-icon">✈️</div>
            <p>還沒有航程記錄</p>
            <p class="empty-hint">開始你的第一次睡眠旅程吧！</p>
        </div>
    </div>

    <!-- 地圖頁 -->
    <div id="map-page" class="page">
        <header class="page-header">
            <h1>🗺️ 飛行路徑</h1>
            <p class="subtitle">查看你的全球足跡</p>
        </header>
        <div id="map-container"></div>
        <div id="map-legend" class="map-legend">
            <div class="legend-item">
                <span class="legend-dot start"></span>
                <span>起點（台北）</span>
            </div>
            <div class="legend-item">
                <span class="legend-dot destination"></span>
                <span>降落點</span>
            </div>
        </div>
    </div>

    <!-- 統計頁 -->
    <div id="stats-page" class="page">
        <header class="page-header">
            <h1>📊 飛行統計</h1>
            <p class="subtitle">你的旅程數據</p>
        </header>
        <div class="stats-container">
            <!-- 統計卡片將由 JavaScript 動態生成 -->
        </div>
        <div class="stats-charts">
            <div class="chart-card">
                <h3>氣候帶分布</h3>
                <div id="climate-chart"></div>
            </div>
            <div class="chart-card">
                <h3>準時率分析</h3>
                <div id="punctuality-chart"></div>
            </div>
        </div>
    </div>

    <!-- 旅程詳情彈窗 -->
    <div id="journey-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- 底部導航 -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-page="journeys">
            <span class="nav-icon">✈️</span>
            <span class="nav-label">旅程</span>
        </button>
        <button class="nav-btn" data-page="map">
            <span class="nav-icon">🗺️</span>
            <span class="nav-label">地圖</span>
        </button>
        <button class="nav-btn" data-page="stats">
            <span class="nav-icon">📊</span>
            <span class="nav-label">統計</span>
        </button>
    </nav>

    <script src="app.js?v=2"></script>
</body>
</html>
