<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, initial-scale=1.0">
    <title>1280x800 螢幕測試頁面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Microsoft YaHei', '微軟雅黑', Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }
        
        .test-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 1200px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        
        .screen-info {
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            font-size: 1.2rem;
            line-height: 1.8;
        }
        
        .screen-info strong {
            color: #ffd700;
        }
        
        .test-section {
            margin: 30px 0;
            padding: 25px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
        }
        
        .test-section h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #ffd700;
        }
        
        .test-button {
            background: linear-gradient(135deg, #00ff88, #00cc6f);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }
        
        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.4);
        }
        
        .test-button:active {
            transform: translateY(0);
        }
        
        .test-button.secondary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .test-button.secondary:hover {
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .status {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            font-size: 1rem;
            min-height: 50px;
        }
        
        .status.success {
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid #00ff88;
        }
        
        .status.error {
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff4444;
        }
        
        .status.info {
            background: rgba(102, 126, 234, 0.2);
            border: 2px solid #667eea;
        }
        
        .grid-test {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        
        .grid-item {
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 1rem;
        }
        
        .ui-preview {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .ui-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 10px;
            min-width: 200px;
        }
        
        .ui-box h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 1280x800 螢幕測試頁面</h1>
        
        <div class="screen-info">
            <div><strong>視窗寬度：</strong><span id="screenWidth">計算中...</span> px</div>
            <div><strong>視窗高度：</strong><span id="screenHeight">計算中...</span> px</div>
            <div><strong>設備像素比：</strong><span id="devicePixelRatio">計算中...</span></div>
            <div><strong>實際解析度：</strong><span id="actualResolution">計算中...</span></div>
        </div>
        
        <div class="test-section">
            <h2>🎵 TTS 語音測試</h2>
            <p>測試樹莓派本地 TTS 服務連接和語音播放</p>
            <button class="test-button" onclick="testLocalTTS()">測試本機 TTS 服務</button>
            <button class="test-button secondary" onclick="testBrowserTTS()">測試瀏覽器 TTS</button>
            <div id="ttsStatus" class="status info">等待測試...</div>
        </div>
        
        <div class="test-section">
            <h2>🎨 UI 元素測試</h2>
            <p>測試基本 UI 元素是否正確顯示</p>
            <div class="grid-test">
                <div class="grid-item">項目 1</div>
                <div class="grid-item">項目 2</div>
                <div class="grid-item">項目 3</div>
                <div class="grid-item">項目 4</div>
            </div>
            
            <div class="ui-preview">
                <div class="ui-box">
                    <h3>💰 Money</h3>
                    <div>10000</div>
                </div>
                <div class="ui-box">
                    <h3>⛽ Fuel</h3>
                    <div>1000/1000</div>
                </div>
                <div class="ui-box">
                    <h3>📍 當前位置</h3>
                    <div>台北</div>
                </div>
            </div>
        </div>
        
        <div class="test-section">
            <h2>🔗 連結測試</h2>
            <button class="test-button secondary" onclick="window.location.href='pi.html'">前往主頁面</button>
            <button class="test-button secondary" onclick="window.location.reload()">重新整理</button>
        </div>
    </div>
    
    <script>
        // 更新螢幕資訊
        function updateScreenInfo() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            const actualWidth = Math.round(width * dpr);
            const actualHeight = Math.round(height * dpr);
            
            document.getElementById('screenWidth').textContent = width;
            document.getElementById('screenHeight').textContent = height;
            document.getElementById('devicePixelRatio').textContent = dpr;
            document.getElementById('actualResolution').textContent = `${actualWidth} x ${actualHeight}`;
        }
        
        // 測試本機 TTS 服務
        async function testLocalTTS() {
            const statusDiv = document.getElementById('ttsStatus');
            statusDiv.className = 'status info';
            statusDiv.textContent = '正在測試本機 TTS 服務...';
            
            try {
                const response = await fetch('http://127.0.0.1:5005/health', {
                    method: 'GET',
                    timeout: 3000
                });
                
                if (response.ok) {
                    statusDiv.textContent = '✅ 本機 TTS 服務連接成功！正在播放測試語音...';
                    statusDiv.className = 'status success';
                    
                    // 測試播放語音
                    try {
                        const ttsResponse = await fetch('http://127.0.0.1:5005/tts/play', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                text: '測試語音播放，如果您聽到這段話，代表樹莓派喇叭運作正常！',
                                languageCode: 'zh-TW'
                            })
                        });
                        
                        if (ttsResponse.ok) {
                            statusDiv.textContent = '✅ TTS 服務測試成功！語音應該已經從喇叭播放出來。';
                        } else {
                            statusDiv.textContent = '⚠️ TTS 服務連接成功，但播放失敗。請檢查音訊設定。';
                            statusDiv.className = 'status error';
                        }
                    } catch (playError) {
                        statusDiv.textContent = '⚠️ 播放請求失敗: ' + playError.message;
                        statusDiv.className = 'status error';
                    }
                } else {
                    throw new Error('服務回應異常');
                }
            } catch (error) {
                statusDiv.textContent = '❌ 無法連接到本機 TTS 服務 (http://127.0.0.1:5005)。請確認服務已啟動：python3 raspberrypi-dsi/web_tts_server.py --port 5005';
                statusDiv.className = 'status error';
                console.error('TTS 測試失敗:', error);
            }
        }
        
        // 測試瀏覽器 TTS
        function testBrowserTTS() {
            const statusDiv = document.getElementById('ttsStatus');
            
            if ('speechSynthesis' in window) {
                statusDiv.className = 'status info';
                statusDiv.textContent = '正在使用瀏覽器 TTS 播放...';
                
                const utterance = new SpeechSynthesisUtterance('瀏覽器語音測試，如果您聽到這段話，代表瀏覽器 TTS 運作正常！');
                utterance.lang = 'zh-TW';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                
                utterance.onend = () => {
                    statusDiv.textContent = '✅ 瀏覽器 TTS 測試完成！';
                    statusDiv.className = 'status success';
                };
                
                utterance.onerror = (error) => {
                    statusDiv.textContent = '❌ 瀏覽器 TTS 播放失敗: ' + error.error;
                    statusDiv.className = 'status error';
                };
                
                speechSynthesis.speak(utterance);
            } else {
                statusDiv.textContent = '❌ 瀏覽器不支援語音合成功能';
                statusDiv.className = 'status error';
            }
        }
        
        // 初始化
        window.addEventListener('load', () => {
            updateScreenInfo();
            window.addEventListener('resize', updateScreenInfo);
            
            // 每秒更新一次螢幕資訊
            setInterval(updateScreenInfo, 1000);
        });
    </script>
</body>
</html>
